<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Open-LLM-Vtuber</title>
    <!--
      C-A-B integration: Monkey-patch WebSocket BEFORE the React bundle
      loads so we can capture the /client-ws connection the app opens.
      With that reference, the Streamlit dashboard (different origin,
      port 8501) can postMessage `CAB_INJECT_CHAT` events into THIS
      iframe and we'll forward them through the SAME WebSocket the app
      is using — so the avatar reacts to example buttons, red-team
      auto-play, and any other parent-driven message, even though
      Streamlit cannot directly access this iframe's DOM.
    -->
    <!--
      C-A-B demo CSS overrides: hide OLLV's chakra-toast notifications
      and any VAD-warning subtitle overlay. These obscure Aria during
      live demos and never carry information the audience needs (the
      governance dashboard at :8501 is the canonical audit surface).
    -->
    <style>
      /* Hide all chakra toasts ("New chat history created",
         VAD warnings, etc.) — they overlay the avatar. */
      .chakra-toast__root,
      [class*="chakra-toast"] {
        display: none !important;
      }
      /* Pin OLLV's html/body to track the iframe's actual height
         (override OLLV's default `height: 100vh` which resolves to
         the outer window viewport, not the iframe). */
      html, body, #root {
        height: 100% !important;
        max-height: 100% !important;
      }
      /* Keep OLLV's bottom-control bar VISIBLE — the user types
         messages there and toggles voice/mic from those controls.
         An earlier pivot hid the whole bar via
         `.chakra-stack:has(textarea){display:none}` to dodge the
         persistent "卡成一半" clipping bug, but that broke
         user-driven messaging and voice toggle. Don't reintroduce
         that hide rule — make the iframe tall enough to fit the
         controls instead (set on the Streamlit side, currently
         height=820).

         Why clipping was hard: OLLV uses `height: 100vh` on
         html/body, which Chrome resolves to OUTER-window viewport
         height when the page is in an iframe — NOT the iframe's
         own height. Our `html, body, #root { height: 100% }`
         override below forces OLLV to fit within the iframe's
         actual height. Combined with a fixed iframe height of
         820px (set by Streamlit via the iframe attribute) this
         gives OLLV: avatar (~580) + idle pill (~40) + mic/hand
         row (~60) + textarea row (~60) + gap (~30) ≈ 770 with
         50px headroom for Chakra reflow at narrow widths.

         Earlier attempts that didn't work and shouldn't be
         reintroduced without solving the named regression:
         - position:fixed bottom:12px on chakra-stack — left the
           idle-status pill (in a DIFFERENT parent) in normal flow
           where it got occluded by the fixed bar.
         - clamp(480, calc(100vh - 280), 660) — `100vh` resolves
           to outer window in iframes, gave wrong heights at every
           viewport size.
         - Hiding the bar — broke user typing + voice toggle. */
    </style>
    <script>
      // MutationObserver that hides any added DOM node whose text
      // contains the VAD-warning string. The string is large and
      // centered on the avatar in OLLV's default rendering, which
      // hijacks the same overlay layer Aria's spoken-text caption uses.
      // We can't disable VAD via URL params, so we treat it at the
      // render layer.
      (function () {
        var VAD_STRINGS = [
          "Voice detected but too brief",
          "speaking louder",
          "speech threshold",
        ];
        function maybeHide(node) {
          if (!(node instanceof Element)) return;
          var txt = node.textContent || "";
          for (var i = 0; i < VAD_STRINGS.length; i++) {
            if (txt.indexOf(VAD_STRINGS[i]) !== -1) {
              node.style.display = "none";
              return;
            }
          }
        }
        var obs = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(maybeHide);
          });
        });
        // Start observing once body exists.
        function attach() {
          if (!document.body) return setTimeout(attach, 50);
          obs.observe(document.body, { childList: true, subtree: true });
          // Also sweep any pre-existing matches.
          document.body.querySelectorAll("*").forEach(maybeHide);
        }
        attach();
      })();
    </script>
    <script>
      (function () {
        var orig = window.WebSocket;
        window._cab_ollv_ws = null;
        window._cab_ws_log = [];
        // Pending injects queue — postMessages that arrived before the
        // OLLV /client-ws WebSocket was OPEN. Drained on WS open so
        // example/red-team buttons fire reliably even right after the
        // iframe re-mounts.
        var pending = [];

        function drainPending() {
          var ws = window._cab_ollv_ws;
          if (!ws || ws.readyState !== orig.OPEN) return;
          // Slight delay so OLLV's server-side init (set-model-and-conf,
          // group-update) lands before we send text-input. Without this,
          // OLLV ignores the first few text-input messages.
          while (pending.length) {
            var text = pending.shift();
            try {
              ws.send(JSON.stringify({ type: "text-input", text: text }));
              window._cab_ws_log.push("drained: " + text.slice(0, 80));
              console.log("[CAB] drained pending inject:", text);
            } catch (err) {
              console.warn("[CAB] drain failed:", err);
            }
          }
        }

        function PatchedWS(url, protocols) {
          var ws = protocols ? new orig(url, protocols) : new orig(url);
          try {
            if (typeof url === "string" && url.indexOf("client-ws") !== -1) {
              window._cab_ollv_ws = ws;
              window._cab_ws_log.push("captured OLLV ws: " + url);
              console.log("[CAB] captured OLLV /client-ws connection");
              // When the WS opens, give OLLV a moment to finish its own
              // init handshake, then drain any buffered injects.
              ws.addEventListener("open", function () {
                window._cab_ws_log.push("ws open; will drain in 800ms");
                setTimeout(drainPending, 800);
              });
            }
          } catch (e) {}
          return ws;
        }
        PatchedWS.prototype = orig.prototype;
        PatchedWS.CONNECTING = orig.CONNECTING;
        PatchedWS.OPEN = orig.OPEN;
        PatchedWS.CLOSING = orig.CLOSING;
        PatchedWS.CLOSED = orig.CLOSED;
        window.WebSocket = PatchedWS;

        window.addEventListener("message", function (e) {
          var d = e.data || {};
          if (d.type === "CAB_INJECT_CHAT" && typeof d.text === "string") {
            var ws = window._cab_ollv_ws;
            if (ws && ws.readyState === orig.OPEN) {
              try {
                ws.send(JSON.stringify({ type: "text-input", text: d.text }));
                window._cab_ws_log.push("injected: " + d.text.slice(0, 80));
                console.log("[CAB] injected text-input via captured ws:", d.text);
              } catch (err) {
                console.warn("[CAB] inject failed:", err);
              }
            } else {
              // Buffer for later drain. Avoids dropping injects that
              // arrive while OLLV's React bundle / WS handshake is
              // still warming up after a fresh iframe mount.
              pending.push(d.text);
              window._cab_ws_log.push(
                "buffered (ws state " +
                  (ws ? ws.readyState : "no-ws") +
                  "): " +
                  d.text.slice(0, 80)
              );
              console.log(
                "[CAB] buffered inject; will drain when WS opens:",
                d.text
              );
            }
          } else if (d.type === "CAB_PING") {
            try {
              (e.source || window.parent).postMessage(
                {
                  type: "CAB_PONG",
                  capturedWS: !!window._cab_ollv_ws,
                  wsState: window._cab_ollv_ws
                    ? window._cab_ollv_ws.readyState
                    : -1,
                  pendingCount: pending.length,
                },
                "*"
              );
            } catch (err) {}
          }
        });
      })();
    </script>
    <script type="module" crossorigin src="./assets/main-nu7uwxNJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-QEkl09-0.css">
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
