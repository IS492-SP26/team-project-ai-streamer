[server]
headless = true

[client]
# Hide the entire native Streamlit toolbar (Deploy button + kebab menu).
# The kebab's only remaining items are Rerun / Clear cache / Print / etc
# which the demo audience doesn't need; removing the bar reclaims the
# top strip and gives the topbar room to breathe.
toolbarMode = "minimal"

[theme]
# Pin to "light" because the canonical handoff-2 look is paper-and-ink.
# Side effect (intentional): Streamlit's kebab menu also hides its
# System / Light / Dark toggle. That toggle would only flip Streamlit's
# native chrome — our CAB palette is keyed off `st.get_option("theme.base")`
# which the runtime menu does NOT update — so a user clicking "Dark"
# produced a half-flipped UI (dark sidebar, light CAB body). Hiding the
# toggle is the simpler fix until a proper CAB-native dark mode is built.
base = "light"
